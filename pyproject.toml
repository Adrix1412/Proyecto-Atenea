[build-system]
requires = ["setuptools>=75,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "alicia-desktop-refactor"
version = "0.2.0"
description = "Alicia desktop with reusable core and optional Django persistence"
requires-python = ">=3.11,<3.13"
dependencies = ["httpx>=0.28.1,<0.29", "pydantic>=2.10,<3", "PyYAML>=6.0.2,<7"]

[project.optional-dependencies]
search = ["ddgs>=9,<10"]
django = ["Django>=5.2.17,<5.3", "psycopg[binary]>=3.2,<4"]
desktop = ["faster-whisper>=1.1,<2", "sounddevice>=0.5,<0.6", "numpy>=1.26,<2.3",
           "pynput>=1.7,<2", "PySide6>=6.8,<7", "edge-tts>=7,<8", "pydub>=0.25.1,<0.26",
           "websockets>=15,<16", "platformdirs>=4,<5", "ddgs>=9,<10"]
dev = ["pytest>=8,<9", "pytest-django>=4.10,<5", "ruff>=0.11,<1", "mypy>=1.15,<2",
       "django-stubs>=5.2,<5.3", "types-PyYAML", "types-pynput"]

[project.scripts]
alicia-desktop = "alicia_desktop.main:main"
alicia-gui = "alicia_desktop.gui:main"

[tool.setuptools.package-data]
alicia_core = ["py.typed"]
alicia_desktop = ["py.typed", "config.example.yaml"]

[tool.setuptools.packages.find]
include = ["alicia_core*", "alicia_desktop*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["mypy_django_plugin.main"]
files = ["alicia_core", "alicia_desktop"]
exclude = ["migrations"]

[tool.django-stubs]
django_settings_module = "tests.settings"

[[tool.mypy.overrides]]
module = ["sounddevice", "faster_whisper.*", "ddgs.*", "pydub.*"]
ignore_missing_imports = true
